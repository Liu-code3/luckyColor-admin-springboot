spring:
  application:
    name: luckycolor-admin-springboot
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:luckycolor_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.luckycolor.admin
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID

server:
  port: ${SERVER_PORT:3002}
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cache:
    key-prefix: ${CACHE_KEY_PREFIX:luckycolor-admin}
  security:
    jwt:
      secret: ${JWT_SECRET:replace-with-a-strong-secret-for-luckycolor-admin}
      expires-in: ${JWT_EXPIRES_IN:2h}
  tenancy:
    enabled: ${TENANT_ENABLED:true}
    header: ${TENANT_HEADER:x-tenant-id}
    domain-suffix: ${TENANT_DOMAIN_SUFFIX:}
    default-tenant-id: ${DEFAULT_TENANT_ID:}
    ignore-paths:
      - /health
      - /api/health
      - /docs
      - /api/docs
      - /swagger-ui
      - /v3/api-docs
      - /api/v3/api-docs
      - /actuator
      - /api/actuator
    ignore-tables:
      - flyway_schema_history
      - sys_tenant
      - sys_tenant_package
      - sys_tenant_audit_log
      - sys_tenant_bootstrap_record
    bootstrap:
      templates:
        - code: default
          name: 默认租户模板
          role-codes:
            - tenant_admin
            - tenant_member
          menu-codes:
            - dashboard
            - system:user
            - system:role
          admin-username: admin
          admin-nickname: 租户管理员
          status: 0
          remark: 内置租户初始化模板
  login-captcha:
    enabled: ${LOGIN_CAPTCHA_ENABLED:true}
  storage:
    root-path: ${STORAGE_ROOT_PATH:D:/zl/storage}
